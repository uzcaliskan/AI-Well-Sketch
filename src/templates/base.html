<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Well Sketch{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --kart:#fff; --yazi:#1f2933; --soluk:#6b7785; --cizgi:#d9dee4; --vurgu:#1c6dd0; --uyari:#b45309; --hata:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --kart:#1d232a; --yazi:#e6e9ed; --soluk:#9aa5b1; --cizgi:#323a44; --vurgu:#6aa8ff; --uyari:#f5b042; --hata:#ff8a80; --ok:#5fd39a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--yazi); font:15px/1.5 system-ui, sans-serif; }
  header { background:var(--kart); border-bottom:1px solid var(--cizgi); padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header a { color:var(--yazi); text-decoration:none; font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  a { color:var(--vurgu); }
  h1,h2,h3 { margin:.2em 0 .5em; }
  .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:8px; padding:14px; margin-bottom:16px; }
  .soluk { color:var(--soluk); font-size:13px; }
  .uyari { color:var(--uyari); } .hata { color:var(--hata); } .ok { color:var(--ok); }
  table { border-collapse:collapse; width:100%; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--cizgi); vertical-align:top; }
  input,select,textarea,button { font:inherit; padding:6px 8px; border:1px solid var(--cizgi); border-radius:6px; background:var(--kart); color:var(--yazi); }
  textarea { width:100%; font-family:ui-monospace, monospace; font-size:12px; }
  button,.dugme { background:var(--vurgu); color:#fff; border:0; cursor:pointer; text-decoration:none; padding:6px 12px; border-radius:6px; display:inline-block; }
  button.ikincil { background:transparent; color:var(--yazi); border:1px solid var(--cizgi); }
  .mesaj { padding:8px 12px; border-radius:6px; margin-bottom:10px; background:var(--kart); border:1px solid var(--cizgi); }
  .mesaj.error { border-color:var(--hata); } .mesaj.success { border-color:var(--ok); }
  .izgara { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap:16px; }
  @media (max-width: 800px) { .izgara { grid-template-columns:1fr; } }
  .sketch { width:100%; height:auto; background:var(--kart); border:1px solid var(--cizgi); border-radius:8px; }
  .sketch text { fill:var(--yazi); }
  form.satir { display:inline; }
  .fotolar { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .fotolar img { width:100%; height:100px; object-fit:cover; border-radius:6px; }
</style>
</head>
<body>
<header>
  <a href="{% url 'well_list' %}">Well Sketch</a>
  {% if user.is_authenticated %}<a href="{% url 'well_create' %}" class="soluk">Yeni kuyu</a>{% endif %}
  <span style="flex:1"></span>
  {% if user.is_authenticated %}
    <span class="soluk">{{ user.get_username }}</span>
    <form method="post" action="{% url 'logout' %}" class="satir">{% csrf_token %}<button class="ikincil">Çıkış</button></form>
  {% endif %}
</header>
<main>
  {% for m in messages %}<div class="mesaj {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
